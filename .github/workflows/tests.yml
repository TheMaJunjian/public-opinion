name: Tests
on:
  push:
    branches: [main, "codex/**", "copilot/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Build and test Node 24 workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build deployment image
        run: docker build -t gonglun:ci .
