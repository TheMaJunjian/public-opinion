name: Tests

on:
  push:
    branches: [main, "codex/**", "copilot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Node 24 tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the application
        run: npm run build

      - name: Validate deployment configuration
        run: |
          bash -n deploy/deploy.sh
          docker compose --env-file deploy/.env.prod.example -f deploy/docker-compose.prod.yml config --quiet

      - name: Build production image
        run: docker build --tag gonglun:ci .
