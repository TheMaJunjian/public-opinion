services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1"
      GONGLUN_DB: /app/data/gonglun.sqlite
      GONGLUN_FOUNDER_KEY: ${GONGLUN_FOUNDER_KEY:?Set GONGLUN_FOUNDER_KEY in deploy/.env.prod}
    volumes:
      - gonglun_data:/app/data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  gonglun_data:
  caddy_data:
  caddy_config:
