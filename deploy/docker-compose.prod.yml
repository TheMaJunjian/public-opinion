services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gonglun
      POSTGRES_USER: gonglun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    image: ${GONGLUN_IMAGE:-gonglun:unconfigured}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://gonglun:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.prod}@postgres:5432/${GONGLUN_DATABASE_NAME:-gonglun}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      GONGLUN_FOUNDER_KEY: ${GONGLUN_FOUNDER_KEY:?Set GONGLUN_FOUNDER_KEY in deploy/.env.prod}
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
