name: gonglun

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
      PORT: "3000"
      GONGLUN_DB: /app/data/gonglun.sqlite
      GONGLUN_FOUNDER_KEY: ${GONGLUN_FOUNDER_KEY:-}
    # Loopback access supports founder registration before Caddy is exposed.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gonglun_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  gonglun_data:
  caddy_data:
  caddy_config:
